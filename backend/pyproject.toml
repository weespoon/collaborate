[project]
name = "collaborate"
version = "0.1.0"
description = "Collaborative doodling backend — local dev shell for a Cloudflare Python Worker"
requires-python = ">=3.11"
# Deliberately empty: this package is imported by the Cloudflare Worker, where
# Pyodide cannot load httpx 0.x. Everything the Worker needs is stdlib. The
# local dev shell installs the `local` extra on top.
dependencies = []

[project.optional-dependencies]
# The local dev shell. None of this reaches the Worker bundle: the Worker talks
# to the API over JS `fetch` and reads prompts from a generated module instead
# of parsing YAML at runtime.
local = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
