[project]
name = "collaborate-worker"
version = "0.1.0"
description = "Cloudflare Python Worker for collaborative doodling"
requires-python = ">=3.13"
# No dependencies. The shared `collaborate` package is copied into src/ by
# `make vendor` rather than installed as a wheel: it declares no dependencies
# of its own, so there is nothing for a resolver to do, and a path-wheel
# dependency would pin a hash that changes on every backend edit.
dependencies = []

[dependency-groups]
dev = ["workers-py", "workers-runtime-sdk"]

